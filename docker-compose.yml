      - "5173:80"
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        VITE_API_BASE_URL: http://15.252.137.218:3000
    ports:
      - "5174:80"
    restart: unless-stopped